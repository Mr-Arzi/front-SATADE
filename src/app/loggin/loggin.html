<div class="satade-bg">
  <div class="login-card">
    <div class="login-logo">
      <!-- Cambia la ruta al logo principal -->
      <img src="satadelogocolor.png" alt="Logo SATADE">
    </div>

    <h1 class="app-name">SATADE</h1>

    <form class="login-form" (submit)="$event.preventDefault(); iniciarSesion()">
      <div class="input-group">
        <input
          type="email"
          placeholder="Correo institucional"
          class="input-field"
          [(ngModel)]="correo"
          name="correo"
        >
      </div>

      <div class="input-group password-group">
        <input
          type="password"
          placeholder="Contraseña"
          class="input-field"
          [(ngModel)]="contrasena"
          name="contrasena"
        >
        <span class="password-icon">👁</span>
      </div>

      <button type="submit" class="btn-login" [disabled]="cargando">
        Iniciar Sesión
      </button>

      <p class="login-error" *ngIf="error">{{ error }}</p>
      

      <a href="#" class="forgot-password">
        ¿Olvidaste tu contraseña?
      </a>
    </form>
  </div>

  <div class="brand-corner">
    <!-- Cambia la ruta al logo pequeño -->
    <img src="satadelogoblanco.png" alt="Logo SATADE pequeño">
    <span>SATADE</span>
  </div>
</div>
